[project]
name = "ai_inclass_examples"
description = "In-class examples for FINM 33200: Generative and Agentic AI for Finance"
maintainer = "Jeremy Bejarano"
copyright = "2025"
os_compatibility = [
    "Windows",
    "Linux",
    "MacOS",
]
requires_chartbook = ">=0.4.0"

[scripts]
build = "doit"

[notebooks.openai_api_overview]
description = "Overview of the OpenAI-compatible API: basic completions, model comparison, streaming, structured outputs, function calling, and web search."
path = "_output/openai_api_overview.ipynb"

[notebooks.benchmarking_llms]
description = "45-minute lecture on benchmarking LLMs: latency/cost, assertion-based eval, LLM-as-judge, thinking vs non-thinking models, tool-use performance gains, standardized benchmarks, and common pitfalls."
path = "_output/benchmarking_llms.ipynb"
